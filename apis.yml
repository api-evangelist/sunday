aid: sunday
name: Sunday
description: >-
  Sunday (Sunday Lawn Care, getsunday.com) is a direct-to-consumer, subscription
  lawn and yard care brand. It builds a personalized annual plan for each
  customer's exact lot from satellite imagery, soil data, and local climate
  patterns, then ships pesticide-free, phosphorus-free fertilizer, weed control,
  grass seed, and pest-control products on a seasonal cadence. Plans include
  Sunny AI guidance and Yard Advisor expert support, plus regional lawn-care
  guides for 1,700+ US cities. Sunday is a consumer commerce company rather than
  an API provider: it publishes a machine-readable llms.txt for agents and runs
  an internal application API (api.getsunday.com), but exposes no public
  developer portal, OpenAPI, SDKs, or documented API surface. It was surfaced as
  a portfolio company of Bond Capital and added to the API Evangelist network.
